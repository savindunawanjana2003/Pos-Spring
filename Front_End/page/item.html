<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Manager · Modern UI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: white;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .glass-panel {
        width: 100%;
        max-width: 1100px;
        background: rgba(18, 26, 40, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(72, 95, 140, 0.4);
        border-radius: 36px;
        padding: 2rem 2.2rem;
        box-shadow:
          0 30px 50px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(156, 180, 255, 0.15) inset;
      }

      .page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 2rem;
      }
      .page-header h1 {
        font-weight: 600;
        font-size: 2.2rem;
        letter-spacing: -0.02em;
        background: linear-gradient(120deg, #ffffff, #bfd9ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 0;
        text-shadow: 0 2px 5px rgba(0, 20, 50, 0.5);
      }
      .page-header i {
        font-size: 2.6rem;
        color: #5f8aff;
        filter: drop-shadow(0 4px 8px #2f4baf);
      }

      .inputContainer {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem 2rem;
        background: rgba(12, 21, 36, 0.7);
        border-radius: 32px;
        padding: 2rem 2rem;
        margin-bottom: 2rem;
        border: 1px solid rgba(86, 120, 190, 0.35);
        box-shadow:
          inset 0 2px 3px rgba(0, 0, 0, 0.6),
          0 8px 18px rgba(0, 10, 30, 0.6);
        backdrop-filter: blur(6px);
      }

      .inputBox {
        display: flex;
        flex-direction: column;
        flex: 1 1 180px;
        min-width: 160px;
      }

      .inputBox label {
        font-weight: 500;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #a9c1f0;
        margin-bottom: 6px;
        margin-left: 6px;
      }

      .inputBox input {
        background: rgba(8, 17, 34, 0.8);
        border: 1.5px solid #2b4060;
        border-radius: 18px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 400;
        color: #f0f4ff;
        transition: 0.2s ease;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      .inputBox input:focus {
        outline: none;
        border-color: #6d8eff;
        background: #0a142c;
        box-shadow:
          0 0 0 4px rgba(109, 142, 255, 0.2),
          0 4px 12px #00000055;
      }

      .inputBox input::placeholder {
        color: #5f739b;
        opacity: 0.7;
      }

      .buttonContainer {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 18px;
        margin: 30px 0 30px;
      }

      .buttonContainer button {
        padding: 14px 30px;
        border-radius: 50px;
        border: none;
        font-weight: 600;
        font-size: 1rem;
        background: linear-gradient(135deg, #1e2f5a, #14223f);
        color: white;
        box-shadow:
          0 10px 16px -5px #020614,
          0 0 0 1px #3e5680 inset;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: 0.15s;
        cursor: pointer;
        letter-spacing: 0.3px;
      }

      .buttonContainer button i {
        font-size: 1.1rem;
        color: #b7cdff;
      }

      .buttonContainer button:hover {
        background: linear-gradient(135deg, #2b3f72, #1d2e58);
        transform: scale(1.03) translateY(-2px);
        box-shadow:
          0 18px 25px -6px #030613,
          0 0 0 1px #7f9cf5 inset;
      }

      .buttonContainer button:active {
        transform: scale(0.98);
        box-shadow: 0 5px 12px #00000099;
      }

      .buttonContainer button:last-child {
        background: linear-gradient(135deg, #25344f, #17212f);
        box-shadow:
          0 8px 14px -4px #030613,
          0 0 0 1px #4a6285 inset;
      }
      .buttonContainer button:last-child i {
        color: #b5dcff;
      }

      .table-responsive {
        border-radius: 28px;
        background: transparent;
        box-shadow:
          0 20px 35px -5px #00000066,
          0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        overflow-x: auto;
        margin-top: 0.8rem;
      }

      .table {
        width: 100%;
        background: rgba(10, 18, 30, 0.7);
        backdrop-filter: blur(8px);
        border-collapse: separate;
        border-spacing: 0;
        margin-bottom: 0;
        border-radius: 28px;
        overflow: hidden;
        color: #eef3fc;
      }

      .table thead tr {
        background: #0d1a2b !important;
        background: linear-gradient(145deg, #121f33, #0b1522);
      }

      .table th {
        font-weight: 600;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 1.2rem 1rem;
        border: none;
        color: #b5d0ff;
        border-bottom: 2px solid #344e7c;
      }

      .table td {
        padding: 1rem 1rem;
        font-weight: 400;
        font-size: 1rem;
        background: transparent;
        border-bottom: 1px solid #273b57;
        color: #deecff;
      }

      .table tbody tr {
        transition: 0.1s;
        cursor: pointer;
      }

      .table tbody tr:hover {
        background-color: #253d62 !important;
        box-shadow: 0 0 0 2px #5f8aff inset;
      }

      .table tbody tr.table-primary {
        background: #26477a !important;
        --bs-table-bg: #26477a;
        color: white;
        border-color: #5f8aff;
      }

      .selected-row {
        background: #1f3f70 !important;
        box-shadow: inset 0 0 0 2px #8aadff;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #19233c;
        border-radius: 20px;
      }
      ::-webkit-scrollbar-thumb {
        background: #3b5185;
        border-radius: 20px;
      }

      #tbodyId tr:last-child td {
        border-bottom: none;
      }

      .swal2-popup {
        border-radius: 30px !important;
      }

      .table > :not(caption) > * > * {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="glass-panel">
      <div class="page-header">
        <!-- <i class="fa-solid fa-cubes"></i> -->
        <h1>Item inventory · control</h1>
      </div>

      <div class="inputContainer">
        <div class="inputBox" id="itemIdbox">
          <label for="itemId"
            ><i class="fa-regular fa-hashtag" style="margin-right: 4px"></i>Item
            Id</label
          >
          <input type="text" id="itemId" placeholder="e.g. ITM-001" />
        </div>
        <div class="inputBox" id="itemnameBox">
          <label for="itemName"
            ><i class="fa-regular fa-tag"></i> Item Name</label
          >
          <input type="text" id="itemName" placeholder="Wireless mouse" />
        </div>
        <div class="inputBox" id="itemQtyBox">
          <label for="itemQty"
            ><i class="fa-regular fa-box"></i> Item Qty</label
          >
          <input type="number" id="itemQty" placeholder="0" />
        </div>
        <div class="inputBox" id="itemPriceBox">
          <label for="itemPrice"
            ><i class="fa-regular fa-dollar-sign"></i> Item Price</label
          >
          <input type="number" id="itemPrice" placeholder="0.00" step="0.01" />
        </div>
      </div>

      <div class="buttonContainer">
        <button onclick="saveItem()">
          <i class="fa-regular fa-floppy-disk"></i> Add Item
        </button>
        <button onclick="updateItem()">
          <i class="fa-regular fa-pen-to-square"></i> Update Item
        </button>
        <button onclick="deleteItem()">
          <i class="fa-regular fa-trash-can"></i> Delete Item
        </button>
        <button onclick="refresh()">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th scope="col">
                <i class="fa-regular fa-fingerprint me-1"></i> Item Id
              </th>
              <th scope="col">
                <i class="fa-regular fa-signature me-1"></i> Item Name
              </th>
              <th scope="col"><i class="fa-regular fa-cubes me-1"></i> Qty</th>
              <th scope="col"><i class="fa-regular fa-coin me-1"></i> Price</th>
            </tr>
          </thead>
          <tbody id="tbodyId"></tbody>
        </table>
      </div>
      <div style="height: 0.5rem"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      function saveItem() {
        const Id = $("#itemId").val();
        const Name = $("#itemName").val();
        const Qty = $("#itemQty").val();
        const Price = $("#itemPrice").val();

        if (!Id || !Name || !Qty || !Price) {
          Swal.fire({
            title: "Please fill all the fields",
            text: "All item details are required",
            icon: "warning",
            timer: 2000,
            showConfirmButton: false,
            background: "#1f2940",
            color: "#fff",
            iconColor: "#f0b341",
          });
          return;
        }

        $.ajax({
          url: "http://localhost:8081/api/v1/Item/saveItem",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({
            itemId: Id,
            itemName: Name,
            qty: Qty,
            price: Price,
          }),
          success: function (respons) {
            if (respons.status === 201) {
              Swal.fire({
                title: "Success!",
                text: respons.message,
                icon: "success",
                timer: 2000,
              });
            } else {
              Swal.fire({
                title: "Un Success!",
                text: respons.message,
                icon: "success",
                timer: 2000,
              });
            }

            getAll();
            clearForm();
            // Swal.fire({
            //   icon: "success",
            //   title: "Saved",
            //   timer: 1200,
            //   showConfirmButton: false,
            //   background: "#1f2940",
            //   color: "#fff",
            // });
          },
          error: function (response) {
            let errormassege = "error avelable";

            if (response.responseJSON) {
              errormassege = response.responseJSON.message;

              if (response.responseJSON.data) {
                const errors = response.responseJSON.data;
                errormassege = Object.values(errors).join(", ");
              }
            }

            Swal.fire({
              title: "Error!",
              text: errormassege,
              icon: "error",
              timer: 3000,
            });
          },
        });
      }

      function updateItem() {
        const Id = $("#itemId").val();
        const Name = $("#itemName").val();
        const Qty = $("#itemQty").val();
        const Price = $("#itemPrice").val();

        if (!Id || !Name || !Qty || !Price) {
          Swal.fire({
            title: "Select a row from table",
            text: "",
            icon: "warning",
            timer: 2000,
            showConfirmButton: false,
            background: "#1f2940",
            color: "#fff",
          });
          return;
        }

        $.ajax({
          url: "http://localhost:8081/api/v1/Item/updateItem",
          method: "PUT",
          contentType: "application/json",
          data: JSON.stringify({
            itemId: Id,
            itemName: Name,
            qty: Qty,
            price: Price,
          }),
          success: function (respons) {
            getAll();
            clearForm();
            if (respons.status === 200) {
              Swal.fire({
                title: "Success!",
                text: respons.message,
                icon: "success",
                timer: 2000,
              });
            }
          },
          error: function (response) {
            let errormassege = "error avelable";

            if (response.responseJSON) {
              errormassege = response.responseJSON.message;

              if (response.responseJSON.data) {
                const errors = response.responseJSON.data;
                errormassege = Object.values(errors).join(", ");
              }
            }

            Swal.fire({
              title: "Error!",
              text: errormassege,
              icon: "error",
              timer: 3000,
            });
          },
        });
      }

      function deleteItem() {
        const Id = $("#itemId").val();
        const Name = $("#itemName").val();
        const Qty = $("#itemQty").val();
        const Price = $("#itemPrice").val();

        if (!Id || !Name || !Qty || !Price) {
          Swal.fire({
            title: "Select row to delete",
            icon: "warning",
            timer: 2000,
            showConfirmButton: false,
            background: "#1f2940",
            color: "#fff",
          });
          return;
        }

        // url: `http://localhost:8081/api/v1/Item/deleteItem?itemId=${Id}`,
        //

        $.ajax({
          url: "http://localhost:8081/api/v1/Item/deleteItem",
          method: "DELETE",
          contentType: "application/json",
          data: JSON.stringify({
            itemId: Id,
            itemName: Name,
            qty: Qty,
            price: Price,
          }),
          success: function (respons) {
            if (respons.status === 204) {
              Swal.fire({
                icon: "success",
                title: "Deleted",
                timer: 1200,
                showConfirmButton: false,
                background: "#1f2940",
                color: "#fff",
              });
            } else {
              Swal.fire({
                icon: "Unsuccess full Deleted",
                title: "Deleted",
                timer: 1200,
                showConfirmButton: false,
                background: "#1f2940",
                color: "#fff",
              });
            }

            getAll();
            clearForm();
          },
          error: function (response) {
            let errormassege = "error avelable";

            if (response.responseJSON) {
              errormassege = response.responseJSON.message;

              if (response.responseJSON.data) {
                const errors = response.responseJSON.data;
                errormassege = Object.values(errors).join(", ");
              }
            }

            Swal.fire({
              title: "Error!",
              text: errormassege,
              icon: "error",
              timer: 3000,
            });
          },
        });
      }

      function refresh() {
        getAll();
        clearForm();
        Swal.fire({
          title: "Refreshed",
          icon: "info",
          timer: 1000,
          showConfirmButton: false,
          background: "#1f2940",
          color: "#fff",
        });
      }

      function getAll() {
        $.ajax({
          url: "http://localhost:8081/api/v1/Item/getAll",
          method: "GET",
          success: function (respons) {
            $("#tbodyId").empty();
            for (let i = 0; i < respons.length; i++) {
              let item = respons[i];
              let row = `<tr style="cursor: pointer;">
                   <td>${item.itemId}</td>
                   <td>${item.itemName}</td>
                   <td>${item.qty}</td>
                   <td>${item.price}</td>
                 </tr>`;
              $("#tbodyId").append(row);
            }
          },
          error: function () {
            Swal.fire({
              icon: "error",
              title: "Could not fetch",
              background: "#1f2940",
              color: "#fff",
            });
          },
        });
      }

      function clearForm() {
        $("#itemId").val("");
        $("#itemName").val("");
        $("#itemQty").val("");
        $("#itemPrice").val("");
        $("#tbodyId tr").removeClass("selected-row");
      }

      $(document).ready(function () {
        getAll();
        clearForm();
      });

      $("#tbodyId").on("click", "tr", function () {
        $("#tbodyId tr").removeClass("selected-row");
        $(this).addClass("selected-row");

        let itemId = $(this).find("td:eq(0)").text();
        let itemName = $(this).find("td:eq(1)").text();
        let itemQty = $(this).find("td:eq(2)").text();
        let itemPrice = $(this).find("td:eq(3)").text();

        $("#itemId").val(itemId);
        $("#itemName").val(itemName);
        $("#itemQty").val(itemQty);
        $("#itemPrice").val(itemPrice);
      });
    </script>
  </body>
</html>
