<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer · modern desk</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* body {
        background: #f5f7fc;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        padding: 2rem 1rem;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      } */

      body {
        background: #f5f7fc;
        font-family: "Inter", sans-serif;

        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: flex-start; /* keep top aligned */
        padding-top: 40px; /* small top spacing */
      }

      .dashboard-card {
        max-width: 1100px;
        width: 100%;
        background: #ffffff;
        border-radius: 32px;
        box-shadow:
          0 25px 50px -12px rgba(0, 20, 60, 0.25),
          0 2px 8px 0 rgba(0, 10, 30, 0.08);
        padding: 2rem 2.2rem;
        backdrop-filter: blur(2px);
        border: 1px solid rgba(255, 255, 255, 0.7);
      }

      .page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 2rem;
        border-bottom: 2px solid #eef2f6;
        padding-bottom: 1rem;
      }

      .page-header h1 {
        font-weight: 600;
        font-size: 2rem;
        letter-spacing: -0.02em;
        color: #1a2639;
        margin: 0;
        background: linear-gradient(145deg, #1e2f5a, #2c3e6e);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .page-header i {
        font-size: 2.4rem;
        color: #3f5e9c;
        filter: drop-shadow(0 6px 10px #a5bbff80);
      }

      .input-group-custom {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        background: #f8fafd;
        border-radius: 28px;
        padding: 2rem 2rem;
        margin-bottom: 2rem;
        border: 1px solid #e1e8f0;
        box-shadow:
          inset 0 2px 4px #ffffff,
          0 6px 14px rgba(0, 10, 30, 0.06);
      }

      .input-group-custom input {
        flex: 1 1 180px;
        padding: 14px 20px;
        border-radius: 60px; /* pill shape */
        border: 1.5px solid #dce2ec;
        background: #ffffff;
        font-size: 0.95rem;
        font-weight: 500;
        color: #1f2a44;
        transition: 0.2s ease;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      }

      .input-group-custom input:focus {
        outline: none;
        border-color: #4f7df3;
        box-shadow:
          0 0 0 4px rgba(79, 125, 243, 0.15),
          0 4px 10px #dee9ff;
      }

      .input-group-custom input::placeholder {
        color: #919fb5;
        font-weight: 400;
      }

      .button-group-custom {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 2.2rem;
      }

      .button-group-custom button {
        min-width: 150px;
        padding: 12px 28px;
        border-radius: 60px;
        border: none;
        font-weight: 600;
        font-size: 0.95rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: white;
        color: #1f2937;
        box-shadow:
          0 8px 18px -8px rgba(30, 50, 100, 0.2),
          0 0 0 1px rgba(79, 125, 243, 0.3);
        transition: 0.15s;
        cursor: pointer;
      }

      #addCustomer {
        background: linear-gradient(135deg, #2050cf, #10328c);
        color: white;
        box-shadow:
          0 12px 22px -8px #1f3f9c80,
          0 0 0 1px #758ef7 inset;
      }
      #updateCustomer {
        background: #ffffff;
        color: #1f3a7c;
        border: 1px solid #b7ceff;
      }
      #deleteCustomer {
        background: #ffffff;
        color: #b91c1c;
        border: 1px solid #ffc3c3;
      }

      .button-group-custom button:hover {
        transform: scale(1.04) translateY(-2px);
      }
      #addCustomer:hover {
        background: linear-gradient(135deg, #2d62f0, #1942b0);
        box-shadow: 0 18px 26px -10px #1f3f9c;
      }
      #updateCustomer:hover {
        background: #eef3ff;
        border-color: #3b6eff;
      }
      #deleteCustomer:hover {
        background: #fff2f2;
        border-color: #ff5e5e;
        color: #a00;
      }

      .table-responsive-custom {
        border-radius: 24px;
        overflow: hidden;
        box-shadow:
          0 12px 28px -8px rgba(0, 20, 40, 0.12),
          0 0 0 1px #e8ecf5 inset;
        background: white;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        background: white;
      }

      table thead tr {
        background: #f0f4fe;
        background: linear-gradient(0deg, #e7edfb, #ffffff);
      }

      table th {
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 1.2rem 1rem;
        color: #1d2b4b;
        border-bottom: 2px solid #cedcf0;
      }

      table td {
        padding: 1rem 1rem;
        font-weight: 500;
        color: #202e4a;
        border-bottom: 1px solid #e7ecf5;
        background: white;
      }

      table tbody tr {
        transition: background 0.1s;
        cursor: pointer;
      }

      table tbody tr:hover {
        background-color: #eaf1fe !important;
      }
      .selected-row {
        background: #dae6ff !important;
        box-shadow: inset 0 0 0 2px #4f7df3;
      }

      #tbodyId tr td:first-child {
        font-weight: 600;
        color: #10328c;
      }

      .input-icon-wrapper {
        position: relative;
        flex: 1 1 180px;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-card">
      <div class="page-header">
        <!-- <i class="fa-regular fa-address-book"></i> -->
        <h1>Customer · directory</h1>
      </div>

      <div class="input-group-custom">
        <input type="text" id="customerId" placeholder=" Customer Id" />
        <input type="text" id="customerName" placeholder="Full name" />
        <input type="text" id="customerAddress" placeholder=" Address" />
      </div>

      <div class="button-group-custom">
        <button id="addCustomer" onclick="saveCustomer()">
          <i class="fa-regular fa-floppy-disk"></i> Add Customer
        </button>
        <button id="updateCustomer" onclick="updateCustomer()">
          <i class="fa-regular fa-pen-to-square"></i> Update
        </button>
        <button id="deleteCustomer" onclick="deleteCustomer()">
          <i class="fa-regular fa-trash-can"></i> Delete
        </button>
      </div>

      <div class="table-responsive-custom">
        <table class="table mb-0" id="customerTable">
          <thead>
            <tr>
              <th><i class="fa-regular fa-hashtag mr-1"></i> id</th>
              <th><i class="fa-regular fa-signature mr-1"></i> name</th>
              <th><i class="fa-regular fa-location-dot mr-1"></i> Address</th>
            </tr>
          </thead>
          <tbody id="tbodyId"></tbody>
        </table>
      </div>
      <div style="height: 0.5rem"></div>
    </div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

    <script>
      function saveCustomer() {
        const cid = $("#customerId").val().trim();
        const cname = $("#customerName").val().trim();
        const caddress = $("#customerAddress").val().trim();
        console.log("====================");
        console.log(cid);
        console.log(cname);
        console.log(caddress);

        if (!cid || !cname || !caddress) {
          Swal.fire({
            title: "Error!",
            text: "Please fill all fields",
            icon: "warning",
            timer: 2000,
          });
          return;
        }

        $.ajax({
          url: "http://localhost:8081/api/v1/customer/save",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({
            cId: cid,
            cName: cname,
            cAddress: caddress,
          }),
          success: function (response) {
            if (response.status === 201) {
              Swal.fire({
                title: "Success!",
                text: "Save successfully ok 🙂",
                icon: "success",
                timer: 2000,
              });
            } else {
              Swal.fire({
                title: "Un Success!",
                text: response.message,
                icon: "success",
                timer: 2000,
              });
            }

            getAllMethod();
            clearForm();
            lodeNextId();
          },
          error: function (response) {
            let errormassege = "error avelable";

            if (response.responseJSON) {
              errormassege = response.responseJSON.message;

              if (response.responseJSON.data) {
                const errors = response.responseJSON.data;
                errormassege = Object.values(errors).join(", ");
              }
            }

            Swal.fire({
              title: "Error!",
              text: errormassege,
              icon: "error",
              timer: 3000,
            });
          },
        });
      }

      function updateCustomer() {
        lodeNextId();
        const id = $("#customerId").val().trim();
        const cname = $("#customerName").val().trim();
        const caddress = $("#customerAddress").val().trim();
        console.log("=====================");
        console.log(id);
        console.log(cname);
        console.log(caddress);
        console.log("=====================");

        if (!id || !cname || !caddress) {
          Swal.fire({
            title: "Error!",
            text: "Please fill all fields",
            icon: "warning",
            timer: 2000,
          });
          return;
        }

        $.ajax({
          url: "http://localhost:8081/api/v1/customer/update",
          method: "PUT",
          contentType: "application/json",
          data: JSON.stringify({
            cId: id,
            cName: cname,
            cAddress: caddress,
          }),
          success: function (response) {
            if (response.status === 200) {
              Swal.fire({
                title: "Success!",
                text: response.message,
                icon: "success",
                timer: 2000,
              });
            }

            getAllMethod();
            clearForm();
          },
          error: function (response) {
            getAllMethod();
            clearForm();
            let errormassege = "error avelable";

            if (response.responseJSON) {
              errormassege = response.responseJSON.message;

              if (response.responseJSON.data) {
                const errors = response.responseJSON.data;
                errormassege = Object.values(errors).join(", ");
              }
            }

            Swal.fire({
              title: "Error!",
              text: errormassege,
              icon: "error",
              timer: 3000,
            });
          },
        });
      }

      function getAllMethod() {
        $.ajax({
          url: "http://localhost:8081/api/v1/customer/getAll",
          method: "GET",
          success: function (response) {
            console.log(response);
            $("#tbodyId").empty();

            for (let i = 0; i < response.length; i++) {
              let customer = response[i];

              let row = `<tr id="trid" style="cursor: pointer;">
            <td>${customer.cId}</td>
            <td>${customer.cName}</td>
            <td>${customer.cAddress}</td>
          </tr>`;

              $("#tbodyId").append(row);
            }
          },

          error: function (respons) {
            // alert(respons.message);
            let errormassege = "error avelable";

            if (respons.responseJSON) {
              errormassege = respons.responseJSON.message;

              if (respons.responseJSON.data) {
                const errors = respons.responseJSON.data;
                errormassege = Object.values(errors).join(", ");
              }
            }

            Swal.fire({
              title: "warning",
              text: errormassege,
              icon: "warning",
              timer: 3000,
            });
          },
        });
      }

      function deleteCustomer() {
        const cid = $("#customerId").val().trim();
        const cname = $("#customerName").val().trim();
        const caddress = $("#customerAddress").val().trim();

        // const id = $("#customerId").val().trim();

        if (!cid) {
          Swal.fire({
            title: "Error!",
            text: "Please Selete a row  in the table to Delete avelable Custormer...",
            icon: "warning",
            timer: 2000,
          });
          return;
        }

        // url: `http://localhost:8081/api/v1/customer/delete?id=${id}`,/

        $.ajax({
          url: "http://localhost:8081/api/v1/customer/delete",
          method: "DELETE",
          contentType: "application/json",
          data: JSON.stringify({
            cId: cid,
            cName: cname,
            cAddress: caddress,
          }),
          success: function (response) {
            if (response.status === 204) {
              Swal.fire({
                title: "success",
                text: response.message,
                icon: "success",
                timer: 2000,
              });
            } else {
              Swal.fire({
                title: "Unsuccess",
                text: response.message,
                icon: "error",
                timer: 2000,
              });
            }

            lodeNextId();
            getAllMethod();
          },
          error: function (respons) {
            let errormassege = "error avelable";

            if (respons.responseJSON) {
              errormassege = respons.responseJSON.message;

              if (respons.responseJSON.data) {
                const errors = respons.responseJSON.data;
                errormassege = Object.values(errors).join(", ");
              }
            }

            Swal.fire({
              title: "warning",
              text: errormassege,
              icon: "warning",
              timer: 3000,
            });
          },
        });
      }

      function clearForm() {
        $("#customerId").val("");
        $("#customerName").val("");
        $("#customerAddress").val("");
      }

      function lodeNextId() {
        $.ajax({
          url: "http://localhost:8081/api/v1/customer/getLastCustormerId",
          method: "GET",
          success: function (respons) {
            console.log(respons + "============================");
            let nextId = Number(respons) + 1;
            const id = nextId + "";
            $("#customerId").val(id);
          },
          error: function (respons) {
            console.log("Internal Serer Error...");
          },
        });
      }

      $("#tbodyId").on("click", "tr", function () {
        $("#tbodyId tr").removeClass("selected-row");
        $(this).addClass("selected-row");

        let id = $(this).find("td:eq(0)").text();
        let name = $(this).find("td:eq(1)").text();
        let address = $(this).find("td:eq(2)").text();
        $("#customerId").val(id);
        $("#customerName").val(name);
        $("#customerAddress").val(address);
      });

      document.addEventListener("DOMContentLoaded", function () {
        lodeNextId();
        getAllMethod();
      });
    </script>
  </body>
</html>
